```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First GitHub Web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #f5f5f5;
        }

        .box {
            width: 500px;
            max-width: 90%;
            margin: auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>안녕하세요!</h1>

        <p>GitHub Pages에서 실행되는 첫 번째 웹페이지입니다.</p>

        <button onclick="showMessage()">
            클릭하세요
        </button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "GitHub Pages가 정상적으로 동작합니다!";
        }
    </script>

</body>
</html>
```
